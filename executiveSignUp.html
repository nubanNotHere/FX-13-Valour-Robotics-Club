<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Sign Up</title>
     <style>
          /* Global Reset & Typography */
        /* Global & Theme Variables */
        :root {
            --matte-black: #0a0a0a;
            --deep-black: #050505;
            --electric-blue: #007bff;
            --off-white: #f5f5f5;
            --muted-gray: #888888;
            --border-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }


body {
    background-color: #0a0a0a; /* Matte Black */
    color: #ffffff;
    overflow: hidden;
}

#signUpScreen {
    display: flex;
    height: 100vh;
    width: 100%;
}

/* Branding Logo Overlay */
#roboticsBrandLogo {
    position: absolute;
    top: 20px;
    left: 30px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 2px;
    z-index: 10;
    text-transform: uppercase;
}

#roboticsBrandLogo span {
    color: #007bff; /* Electric Blue */
}

/* Left Side: Image Container */
#imgContainer {
    flex: 1;
    background-color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid #222;
}

#imgContainer img {
    width: 80%;
    height: auto;
    filter: drop-shadow(0 0 20px rgba(0, 123, 255, 0.2));
}

/* Right Side: Form Container */
#formContainer {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: linear-gradient(135deg, #0a0a0a 0%, #111 100%);
}

#form {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
}

#signInp {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 25px;
    border-left: 4px solid #007bff;
    padding-left: 15px;
}

/* Form Elements */
label {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

input, select {
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 12px;
    color: white;
    margin-bottom: 15px;
    outline: none;
    transition: all 0.3s ease;
}

input:focus, select:focus {
    border-color: #007bff;
    box-shadow: 0 0 10px rgba(0, 123, 255, 0.1);
}

/* Specific styling for the Button (Box-style) */
button {
    background-color: #007bff;
    color: white;
    padding: 15px;
    border: none;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.2s, background-color 0.3s;
}

button:hover {
    background-color: #0056b3;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

/* Bottom Text & Link */
#signUp {
    margin-top: 20px;
    font-size: 0.9rem;
    color: #888;
    text-align: center;
}

#signUp a {
    color: #007bff;
    text-decoration: none;
    font-weight: 600;
}

#signUp a:hover {
    text-decoration: underline;
}

/* Responsive for smaller screens */
@media (max-width: 768px) {
    #signUpScreen {
        flex-direction: column;
    }
    #imgContainer {
        display: none;
    }
    #roboticsBrandLogo {
        position: relative;
        top: 0;
        left: 0;
        text-align: center;
        width: 100%;
        margin-bottom: 20px;
    }
    #formContainer {
        width: 100%;
        flex: 1;
    }
}

/* SUCCESS MESSAGE STYLING (Themed Overlay) */
        #successfullAccountCreation {
            display: none; /* Initially Hidden */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--matte-black);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* Success Container Box - Full Border Design */
        .success-box {
            border: 1px solid var(--electric-blue);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            position: relative;
        }

        /* Technical corner details to make it look "Robotic" */
        .success-box::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            width: 20px;
            height: 20px;
            border-top: 2px solid var(--electric-blue);
            border-left: 2px solid var(--electric-blue);
        }

        #Congratulations {
            color: var(--electric-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        #AccountStatus {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            color: var(--off-white);
            letter-spacing: -1px;
        }

        #details {
            color: var(--muted-gray);
            font-size: 1rem;
            max-width: 400px;
            margin: 0 auto 40px auto;
            line-height: 1.6;
        }

        #successfullAccountCreation button {
            background-color: transparent;
            border: 1px solid var(--electric-blue);
            font-size: 1.2rem;
            width: auto;
            min-width: 250px;
        }

        #successfullAccountCreation button a {
            color: var(--electric-blue);
            text-decoration: none;
            display: block;
            padding: 5px 20px;
        }

        #successfullAccountCreation button:hover {
            background-color: var(--electric-blue);
        }

        #successfullAccountCreation button:hover a {
            color: white;
        }

        @media (max-width: 850px) {
            #imgContainer { display: none; }
            #formContainer { padding: 30px; }
        }
     </style>
</head>
<body>
     <div id="signUpScreen">
          <p id="roboticsBrandLogo">FX-13 <span>Valour</span></p>
          <div id="imgContainer">
               <img src="/public/Images/Executives SignIn.png" alt="Image">
          </div>
          <div id="formContainer">
               <div id="form">
                    <p id="signInp">Sign Up</p>
                    <label for="email">Email: </label>
                    <input type="email" id="email" placeholder="example@gmail.com"  required>
                    <label for="fullName">Full Name: </label>
                    <input type="text" id="fullName" placeholder="Your Full Name" required>
                    <label for="phoneNumber">Phone Number: </label>
                    <input type="number" id="phoneNumber" placeholder="017*******0" required>
                    <label for="class">Your Class: </label>
                    <select id="class">
                         <option value="8">class 8</option>
                         <option value="9">class 9</option>
                         <option value="O">O Level</option>
                         <option value="AS">AS Level</option>
                         <option value="A">A Level</option>
                    </select>
                    <label for="section">Section: </label>
                    <input type="text" id="section" placeholder="Venus">
                    <label for="joiningYear">Joining Year</label>
                    <select id="joiningYear">
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                    <label for="gender">Your Gender</label>
                    <select id="gender">
                         <option value="male">Male</option>
                         <option value="female">Female</option>
                         <option value="male">Helicopter (Male)</option>
                         <option value="female">Helicopter (Female)</option>
                    </select>
                    <label for="password">Password: </label>
                    <input type="password" id="password" placeholder="Password you want to give" required>
                    <label for="confirmPassword">Confirm Password: </label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    <button id="continueBtn">Continue</button>
                    <p id="signUp">Already have an account? <span><a href="executiveSignIn.html">Sign In</a></span></p>
               </div>
          </div>
     </div>

         <!-- Success Overlay -->
    <div id="successfullAccountCreation">
        <div class="success-box">
            <p id="Congratulations">System Update</p>
            <p id="AccountStatus">Account Created Successfully 🎉</p>
            <p id="details">Your executive credentials have been verified. You can now access your profile and the internal dashboard.</p>
            <button><a href="/public/index.html">Go Back to Website</a></button>
        </div>
    </div>

     <script type="module" src="executiveSignUp.js"></script>
</body>
</html>
